name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: head
        name: Check this commit is still the head of main
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if ! remote=$(timeout 30 git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main); then
            echo "::warning::Could not check the head of main (git ls-remote failed). Deploying this commit anyway."
            exit 0
          fi
          head=$(printf '%s\n' "$remote" | awk '$2 == "refs/heads/main" { print $1 }')
          if [ -z "$head" ]; then
            echo "::warning::Could not check the head of main (no refs/heads/main in the git ls-remote output). Deploying this commit anyway."
            exit 0
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping deploy. $GITHUB_SHA is no longer the head of main ($head is). The run for the newer commit will deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.head.outputs.stale != 'true'
        uses: actions/deploy-pages@v5
