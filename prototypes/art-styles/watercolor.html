<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axolotl Canal - Watercolor Style</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom,
      #cddde3 0%, #e8e4d3 22%,
      #bcdcdc 22%, #86b6c2 55%, #5c88a0 88%,
      #7a6a5c 92%, #6e5f54 100%);
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>
<canvas id="scene" width="480" height="360" role="img" aria-label="Watercolor style animated scene: a pink axolotl swimming in a Xochimilco canal with reeds, lily pads and rising bubbles">Watercolor style axolotl canal scene.</canvas>
<script src="watercolor.js" defer></script>
</body>
</html>
