<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axolotl Canal - Pixel Art Style</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1d5478;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    flex: none;
    background: #1d5478;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="scene" width="640" height="480" role="img" aria-label="Pixel art style: a pink axolotl swimming in a Xochimilco canal with reeds, lily pads and rising bubbles">Pixel art style axolotl canal scene.</canvas>
<script src="pixel.js" defer></script>
</body>
</html>
