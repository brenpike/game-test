<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c6a8c" />
    <title>Glam Gills: Find Your Flair</title>
    <meta name="apple-mobile-web-app-title" content="Glam Gills" />

    <style>

      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c6a8c;

        user-select: none;

        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        touch-action: none;

    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
